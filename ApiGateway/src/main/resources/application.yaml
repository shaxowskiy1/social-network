
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/auth/**
            - id: post-service
              uri: http://localhost:8081
              predicates:
                - Path=/post
  main:
    web-application-type: reactive
server:
  port: 8085
